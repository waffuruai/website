# Toolchain, pinned. `mise install` fetches it (checksummed through mise's
# registries) and CI installs the same file with jdx/mise-action. Keep
# `packageManager` in package.json equal to the pnpm pin: pnpm and the
# Cloudflare build read it there.
[tools]
node = "26.12.1"
pnpm = "12.15.0"
shellcheck = "0.11.0"
