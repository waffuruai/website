# Builds and deploys waffuru.ai to Cloudflare, and doubles as the release
# receiver: each product's release workflow dispatches this with
# `gh workflow run release.yml`.
#
# Nothing is committed here. Every run rebuilds the site (Next.js static
# export) and adds the installers fetched and verified from each product's
# latest release, then deploys both with the Worker in one atomic version. A
# verification failure fails the deploy and leaves the live version untouched.
name: Release receiver and site deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: Product whose release triggered this run (informational)
        required: false
        type: string
      tag:
        description: Release tag that triggered this run (informational)
        required: false
        type: string

permissions:
  contents: read

# Never cancel a deploy in flight; queue the next one behind it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      - name: Validate the tasks
        run: mise tasks validate

      # S10: tasks see only mise and its pinned tools plus the base system (no
      # Homebrew prefix, no /usr/local, no ~/.cargo/bin), so a tool missing from
      # [tools] fails here. The tool directories mise-action added stay first.
      - name: Cut PATH to mise and the base system
        run: echo "PATH=$(dirname "$(command -v mise)"):/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: mise run bootstrap

      # Typecheck, lint (eslint, shellcheck), unit and release fetcher tests, format check.
      - name: Check
        run: mise run check

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://waffuru.ai
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      # S10, as in the test job.
      - name: Cut PATH to mise and the base system
        run: echo "PATH=$(dirname "$(command -v mise)"):/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: Note the dispatching release
        if: inputs.product != ''
        env:
          PRODUCT: ${{ inputs.product }}
          TAG: ${{ inputs.tag }}
        run: echo "triggered by $PRODUCT $TAG"

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: mise run bootstrap

      # Production is the only build that carries the GA ID; previews and
      # local builds never load analytics.
      - name: Build and assemble the site
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GA_ID" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_GA_ID is not set"
            exit 1
          fi
          mise run assemble

      - name: Fetch and verify the product installers
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN || github.token }}
          RELEASE_VERIFY_ATTESTATION: ${{ vars.RELEASE_VERIFY_ATTESTATION || 'auto' }}
        run: mise run fetch-releases

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
