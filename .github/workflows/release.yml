# Builds and deploys waffuru.ai to Cloudflare, and doubles as the release
# receiver: each product's release workflow dispatches this with
# `gh workflow run release.yml`.
#
# Nothing is committed here. Every run rebuilds the site (Next.js static
# export) and adds the installers fetched and verified from each product's
# latest release, then deploys both with the Worker in one atomic version. A
# verification failure fails the deploy and leaves the live version untouched.
name: Release receiver and site deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      product:
        description: Product whose release triggered this run (informational)
        required: false
        type: string
      tag:
        description: Release tag that triggered this run (informational)
        required: false
        type: string

permissions:
  contents: read

# Never cancel a deploy in flight; queue the next one behind it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Test the release fetcher
        run: scripts/test-fetch-releases.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test, format
        run: pnpm check

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://waffuru.ai
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Note the dispatching release
        if: inputs.product != ''
        env:
          PRODUCT: ${{ inputs.product }}
          TAG: ${{ inputs.tag }}
        run: echo "triggered by $PRODUCT $TAG"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Production is the only build that carries the GA ID; previews and
      # local builds never load analytics.
      - name: Build the site
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GA_ID" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_GA_ID is not set"
            exit 1
          fi
          pnpm build

      - name: Assemble the site
        run: node scripts/assemble-site.mjs

      - name: Fetch and verify the product installers
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN || github.token }}
          RELEASE_VERIFY_ATTESTATION: ${{ vars.RELEASE_VERIFY_ATTESTATION || 'auto' }}
        run: scripts/fetch-releases.sh releases/products.json _site

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
